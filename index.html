<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lastro">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lastro</title>
<style>
:root{--bg:#F4F1EA;--card:#FFFFFF;--ink:#1A1D1A;--muted:#6B6F68;--line:#E6E1D6;--accent:#1F6B52;--on-accent:#FFFFFF;--accent-soft:#E1EEE7;--warn:#A85A07;--warn-soft:#FBEBD5;--bad:#B42318;--bad-soft:#FBE4E0;--chip:#EEEAE1;--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#111311;--card:#1B1E1B;--ink:#ECEDE8;--muted:#9A9F96;--line:#2A2E2A;--accent:#5CC59A;--on-accent:#08170F;--accent-soft:#1B3328;--warn:#F0A44B;--warn-soft:#3A2A15;--bad:#F07A6E;--bad-soft:#3B1C19;--chip:#262A26}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px calc(112px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 2px}
h1{font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.15}
h2{font-size:21px;letter-spacing:-.01em;margin:4px 0}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 4px 6px;font-weight:600}
p{margin:6px 0}
.sub{color:var(--muted);font-size:14px}
small.sub{display:block;margin-top:5px;font-size:12.5px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 0 var(--line)}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:2px 0 4px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrapgap{flex-wrap:wrap}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.list .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0;padding-top:2px}
.list .item:last-child{padding-bottom:2px}
.tap{cursor:pointer}
.emo{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{font-weight:600}
.r{text-align:right;white-space:nowrap}
.pos{color:var(--accent)}.neg{color:var(--bad)}.wtxt{color:var(--warn)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:600 16px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--accent);color:var(--on-accent);width:100%;cursor:pointer;display:block;text-align:center}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;width:auto;border-radius:10px;display:inline-block}
.btn+.btn{margin-top:10px}
.btns{display:flex;gap:10px;margin-top:12px}.btns .btn{margin:0}
.iconbtn{background:var(--chip);border:0;width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--ink);cursor:pointer;flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;color:var(--muted);font:500 11px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;min-width:62px;cursor:pointer}
.tab.on{color:var(--accent)}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;font-size:32px;line-height:1;margin-top:-24px;box-shadow:0 8px 20px rgba(0,0,0,.2);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:93vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px}
input,select,textarea{width:100%;font:16px/1.3 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=date],input[type=month]{min-height:46px}
label.check{display:flex;align-items:center;gap:12px;padding:12px 2px;font-size:15px}
label.check input{width:22px;height:22px;flex:none;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid transparent;background:var(--chip);color:var(--ink);border-radius:12px;padding:8px 11px;font:14px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font:600 14px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{font-size:42px;font-weight:700;text-align:center;border:0;background:none;padding:10px 0 4px;letter-spacing:-.02em}
.amount:focus{outline:none}
.amtwrap{display:flex;align-items:baseline;justify-content:center;gap:6px;color:var(--muted);font-size:22px;font-weight:600}
.amtwrap input{max-width:260px;color:var(--ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.35}
.alert.warn{background:var(--warn-soft)}.alert.bad{background:var(--bad-soft)}.alert.good{background:var(--accent-soft)}.alert.info{background:var(--chip)}
.alert>span:first-child{flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);vertical-align:1px}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:0 1px 0 var(--line)}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.kpi b{font-size:15px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav h1{font-size:24px;text-align:center;flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:4px}
.obrow{background:var(--card);border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 0 var(--line)}
.obrow .ins{display:grid;gap:8px;margin-top:8px}
.ins.c3{grid-template-columns:1.3fr .7fr 1.4fr}
.ins.c2{grid-template-columns:1fr 1fr}
.ins.c4{grid-template-columns:1fr 1fr 1fr}
.mini{font-size:12px;color:var(--muted);margin:0 0 4px 2px;display:block}
.rank{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.empty{text-align:center;padding:26px 10px}
.empty .e{font-size:42px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sticky{position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:5}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:8px 2px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.hr{height:1px;background:var(--line);margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
'use strict';
/* ================= utilidades ================= */
const KEY='lastro.v1';
const $=s=>document.querySelector(s);
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const R=v=>BRL.format(+v||0);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curYm=()=>todayStr().slice(0,7);
const addM=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
const mBetween=(a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return(yb-ya)*12+(mb-ma)};
const dim=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const ymLabel=ym=>{const[y,m]=ym.split('-').map(Number);return MESES[m-1]+' '+y};
const ymShort=ym=>{const[y,m]=ym.split('-').map(Number);return MES3[m-1]+'/'+String(y).slice(2)};
const dateIn=(ym,dia)=>ym+'-'+pad(Math.min(Math.max(1,parseInt(dia)||1),dim(ym)));
const addDays=(s,n)=>{const[y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const dDiff=(a,b)=>{const p=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const dLabel=s=>s.slice(8,10)+'/'+s.slice(5,7);
const addMDate=(s,n)=>dateIn(addM(s.slice(0,7),n),+s.slice(8,10));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const P=s=>{if(typeof s==='number')return s;s=String(s??'').trim().replace(/[R$\s%]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
const NS=n=>(n||n===0)&&n!==''?String(Math.round(n*100)/100).replace('.',','):'';
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const r2=n=>Math.round(n*100)/100;
function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++){if(x[k[i]]==null)x[k[i]]={};x=x[k[i]]}x[k[k.length-1]]=v}

/* ================= dados ================= */
const CATS_PADRAO=[
 ['🏠','Aluguel','essencial'],['🏢','Condomínio','essencial'],['🚗','Transporte','essencial'],['🛒','Alimentação','essencial'],
 ['💡','Energia','essencial'],['🚰','Água','essencial'],['🌐','Internet','essencial'],['📞','Celular','essencial'],
 ['🏨','Saúde','essencial'],['💊','Farmácia','essencial'],['🧹','Diarista','essencial'],['⚠️','Necessidades','essencial'],
 ['🏋️','Academia','estilo'],['🏆','Cross fit','estilo'],['✨','Salão / Barbearia','estilo'],['🎓','Educação','estilo'],
 ['🏖️','Lazer','estilo'],['🍔','Restaurantes / Delivery','estilo'],['📺','Assinaturas','estilo'],['🛍️','Compras','estilo']];
const RECS_PADRAO=[['💼','Salário'],['💸','Renda extra'],['🏷️','Vendas'],['📈','Rendimentos'],['🏘️','Aluguel recebido'],['🎁','Benefícios / Ajuda'],['🎯','Cashback / Recompensas']];
const FIXAS_SUG=['Aluguel','Condomínio','Energia','Água','Internet','Celular','Diarista','Academia','Cross fit','Assinaturas'];
const GRUPOS={essencial:'Essencial',estilo:'Estilo de vida',compromisso:'Dívidas e metas',receita:'Receitas'};
const TIPOS_DIV=[
 {id:'emprestimo',nome:'Empréstimo pessoal',e:'🏦',parc:true},
 {id:'consignado',nome:'Consignado',e:'🧾',parc:true},
 {id:'veiculo',nome:'Financiamento de veículo',e:'🚗',parc:true},
 {id:'imovel',nome:'Financiamento imobiliário',e:'🏠',parc:true},
 {id:'parcfatura',nome:'Parcelamento de fatura',e:'💳',parc:true},
 {id:'rotativo',nome:'Rotativo do cartão',e:'🔥',parc:false},
 {id:'cheque',nome:'Cheque especial',e:'⚠️',parc:false},
 {id:'crediario',nome:'Crediário / carnê de loja',e:'🛍️',parc:true},
 {id:'acordo',nome:'Acordo / renegociação',e:'🤝',parc:true},
 {id:'pessoa',nome:'Dívida com pessoa',e:'👤',parc:true},
 {id:'impostos',nome:'Impostos e taxas atrasados',e:'🏛️',parc:true},
 {id:'outra',nome:'Outra',e:'📌',parc:true}];
const TIPO=id=>TIPOS_DIV.find(t=>t.id===id)||TIPOS_DIV[TIPOS_DIV.length-1];
const STATUS_DIV={emdia:'Em dia',atrasada:'Atrasada',negociando:'Em negociação',quitada:'Quitada'};

function newState(){
 const c=CATS_PADRAO.map(([e,n,g])=>({id:uid(),emoji:e,nome:n,grupo:g,tipo:'despesa',orcado:0}));
 const r=RECS_PADRAO.map(([e,n])=>({id:uid(),emoji:e,nome:n,grupo:'receita',tipo:'receita'}));
 c.push({id:'cat_divida',emoji:'🤝',nome:'Pagamento de dívidas',grupo:'compromisso',tipo:'despesa',orcado:0,sys:true});
 c.push({id:'cat_meta',emoji:'🎯',nome:'Metas e reserva',grupo:'compromisso',tipo:'despesa',orcado:0,sys:true});
 return{v:1,setupDone:false,nome:'',criado:todayStr(),contas:[],cartoes:[],categorias:[...c,...r],tx:[],fixas:[],gerados:{},dividas:[],metas:[],faturas:{},divOk:{},prefs:{estrategia:'avalanche'}};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v)return migrate(s)}catch(e){}return newState()}
function migrate(s){const d=newState();for(const k of Object.keys(d))if(s[k]===undefined)s[k]=d[k];return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar no aparelho')}}

let S=load();
let UI={tab:'inicio',ym:curYm()};
let OB=null,SHEET=null;

/* ================= lookups ================= */
const cat=id=>S.categorias.find(c=>c.id===id)||{emoji:'❔',nome:'Sem categoria',grupo:'estilo'};
const conta=id=>S.contas.find(c=>c.id===id);
const cartao=id=>S.cartoes.find(c=>c.id===id);
const catsDe=tipo=>S.categorias.filter(c=>c.tipo===tipo&&!c.sys);
function payOpts(cards=true){const o=S.contas.map(c=>['c:'+c.id,'🏦 '+c.nome]);if(cards)S.cartoes.forEach(c=>o.push(['k:'+c.id,'💳 '+c.nome]));return o}
function parsePag(p){p=p||'';return{contaId:p.startsWith('c:')?p.slice(2):'',cartaoId:p.startsWith('k:')?p.slice(2):''}}
function pagOf(t){return t.cartaoId?'k:'+t.cartaoId:(t.contaId?'c:'+t.contaId:'')}
function pagLabel(t){if(t.cartaoId){const c=cartao(t.cartaoId);return c?'💳 '+c.nome:''}const c=conta(t.contaId);return c?c.nome:''}
function defaultPag(){const p=S.prefs.ultPag;if(p&&(conta(p.slice(2))||cartao(p.slice(2))))return p;return S.contas[0]?'c:'+S.contas[0].id:''}

/* ================= motor ================= */
function ensureMonth(ym){
 if(ym>addM(curYm(),12))return;let ch=false;
 for(const f of S.fixas){
  if(f.ativa===false||f.inicio>ym||(f.fim&&ym>f.fim))continue;
  const k=f.id+'|'+ym;if(S.gerados[k])continue;S.gerados[k]=1;ch=true;
  S.tx.push({id:uid(),data:dateIn(ym,f.dia),desc:f.desc,valor:f.valor,tipo:f.tipo,catId:f.catId,contaId:f.contaId||'',cartaoId:f.cartaoId||'',status:f.cartaoId?'pago':'pendente',recId:f.id});
 }
 if(ch)save();
}
function faturaYm(t,c){const ym=t.data.slice(0,7),d=+t.data.slice(8,10);let f=d>=c.fechamento?addM(ym,1):ym;return c.vencimento>c.fechamento?f:addM(f,1)}
function fatura(cid,ym){const c=cartao(cid);const its=S.tx.filter(t=>t.cartaoId===cid&&faturaYm(t,c)===ym);const tot=sum(its,t=>t.tipo==='despesa'?t.valor:-t.valor);return{c,ym,its,total:r2(tot),pago:S.faturas[cid+'|'+ym],venc:dateIn(ym,c.vencimento)}}
function limiteUsado(cid){const c=cartao(cid);return sum(S.tx.filter(t=>t.cartaoId===cid&&t.tipo==='despesa'&&!S.faturas[cid+'|'+faturaYm(t,c)]),t=>t.valor)}
function saldoConta(c){let s=+c.saldoInicial||0;const desde=c.desde||'0000';
 for(const t of S.tx){if(t.contaId!==c.id||t.cartaoId||t.status!=='pago'||t.data<desde)continue;s+=t.tipo==='receita'?t.valor:-t.valor}
 for(const[k,f]of Object.entries(S.faturas))if(f.contaId===c.id)s-=f.valor;return s}

const isParc=d=>TIPO(d.tipo).parc;
const mensalDiv=d=>isParc(d)?(+d.parcela||0):(+d.pagamentoMensal||0);
const paidIn=(d,ym)=>!!S.divOk[d.id+'|'+ym]||S.tx.some(t=>t.divId===d.id&&t.data.slice(0,7)===ym);
function divCalc(d){
 const i=(+d.juros||0)/100,cur=curYm(),pagoMes=paidIn(d,cur);
 if(isParc(d)){
  const n=Math.max(0,(+d.totalParc||0)-(+d.pagas||0)),p=+d.parcela||0;
  const saldo=i>0?p*(1-Math.pow(1+i,-n))/i:p*n,total=p*n;
  return{saldo,mensal:p,jurosMes:saldo*i,meses:n,quita:n>0?addM(cur,pagoMes?n:n-1):cur,total,jurosRest:total-saldo,prog:(+d.totalParc)?(+d.pagas)/(+d.totalParc):0,cresce:false};
 }
 const s=+d.saldo||0,p=+d.pagamentoMensal||0,jm=s*i;let meses=Infinity,total=Infinity;
 if(s<=0){meses=0;total=0}
 else if(p>jm){meses=i>0?Math.ceil(-Math.log(1-i*s/p)/Math.log(1+i)):Math.ceil(s/p);let b=s;total=0;for(let k=0;k<meses&&k<600;k++){b=b*(1+i);const pg=Math.min(p,b);total+=pg;b-=pg}}
 const v0=+d.valorOriginal||s;
 return{saldo:s,mensal:p,jurosMes:jm,meses,quita:isFinite(meses)?addM(cur,Math.max(0,pagoMes?meses:meses-1)):null,total,jurosRest:isFinite(total)?total-s:Infinity,prog:v0>0?Math.max(0,(v0-s)/v0):0,cresce:s>0&&p<=jm};
}
function dividasAtivas(){return S.dividas.filter(d=>d.status!=='quitada')}
function ordemDividas(){const a=dividasAtivas().map(d=>({d,c:divCalc(d)}));
 if(S.prefs.estrategia==='bola')a.sort((x,y)=>x.c.saldo-y.c.saldo);else a.sort((x,y)=>(+y.d.juros||0)-(+x.d.juros||0)||x.c.saldo-y.c.saldo);return a}
function dividasPendentes(ym){const cur=curYm(),out=[];
 for(const d of dividasAtivas()){
  if(ym<(d.criada||cur)||paidIn(d,ym))continue;const m=mensalDiv(d);if(m<=0)continue;
  const c=divCalc(d);if(c.saldo<=0)continue;
  if(isParc(d)){const ahead=mBetween(cur,ym)-(paidIn(d,cur)?1:0);if(ahead>=c.meses)continue}
  out.push({d,valor:Math.min(m,isParc(d)?m:c.saldo*(1+(+d.juros||0)/100)),data:dateIn(ym,d.dia||10)});
 }return out}

function monthData(ym){
 ensureMonth(ym);const txs=S.tx.filter(t=>t.data.slice(0,7)===ym);
 let rec=0,recP=0,desp=0,despP=0;const porCat={};
 for(const t of txs){if(t.tipo==='receita'){rec+=t.valor;if(t.status==='pago')recP+=t.valor}else{desp+=t.valor;if(t.status==='pago')despP+=t.valor;porCat[t.catId]=(porCat[t.catId]||0)+t.valor}}
 const divPend=dividasPendentes(ym),divTotal=sum(divPend,x=>x.valor);
 const cs=S.categorias.filter(c=>c.tipo==='despesa'&&(c.grupo==='essencial'||c.grupo==='estilo'));
 const orc=sum(cs,c=>+c.orcado||0),gastoOrc=sum(cs,c=>porCat[c.id]||0);
 return{txs,rec,recP,desp,despP,divPend,divTotal,sobra:rec-desp-divTotal,porCat,orc,gastoOrc};
}

 if(M.rec===0)out.push(['info','💼','Nenhuma entrada neste mês ainda. Cadastre seu salário como lançamento fixo (Ajustes) para ver a sobra real.']);
 else if(M.sobra<0)out.push(['bad','📉',`As saídas previstas do mês superam as entradas em ${R(-M.sobra)}.`]);
 const est=[],quase=[];
 for(const c of S.categorias.filter(c=>c.tipo==='despesa'&&c.orcado>0)){const g=M.porCat[c.id]||0;if(g>c.orcado)est.push([c,g]);else if(g>=.8*c.orcado&&g<c.orcado-0.005&&M.txs.some(t=>t.catId===c.id&&!t.recId))quase.push([c,g])}
 est.sort((a,b)=>(b[1]-b[0].orcado)-(a[1]-a[0].orcado)).slice(0,2).forEach(([c,g])=>out.push(['bad',c.emoji,`${c.nome} passou ${R(g-c.orcado)} do orçado.`]));
 quase.slice(0,2).forEach(([c,g])=>out.push(['warn',c.emoji,`${c.nome} já usou ${pct(g,c.orcado)}% do orçado. Restam ${R(c.orcado-g)}.`]));

 const fixVal=sum(S.fixas.filter(f=>fixIds.has(f.id)&&vCats.some(c=>c.id===f.catId)),f=>f.valor);
 const orcVar=M.orc-fixVal;const gv=sum(M.txs.filter(t=>t.tipo==='despesa'&&!t.recId&&vCats.some(c=>c.id===t.catId)),t=>t.valor);
 if(d>=5&&orcVar>0){const proj=gv/d*D;if(proj>orcVar*1.05)out.push(['warn','🏃',`No ritmo atual, os gastos do dia a dia fecham o mês em ~${R(proj)}, acima dos ${R(orcVar)} previstos.`])}
 for(const x of dividasAtivas()){const c=divCalc(x);if(c.cresce)out.push(['bad','🔥',`${x.nome}: o pagamento mensal não cobre os juros (~${R(c.jurosMes)}/mês). Essa dívida só cresce.`])}
 const atrasD=S.dividas.filter(x=>x.status==='atrasada');if(atrasD.length)out.push(['bad','⚠️',`${atrasD.length===1?'1 dívida marcada':atrasD.length+' dívidas marcadas'} como atrasada. Priorize negociar antes que os encargos aumentem.`]);
 const man=S.tx.filter(t=>t.criado).map(t=>t.criado);const last=man.length?Math.max(...man):new Date(S.criado+'T12:00').getTime();
 const semDias=Math.floor((Date.now()-last)/864e5);if(semDias>=3)out.push(['info','✍️',`Faz ${semDias} dias sem lançar nada. Dois minutos agora mantêm tudo em dia.`]);
 const top=Object.entries(M.porCat).filter(([id])=>!cat(id).sys).sort((a,b)=>b[1]-a[1]).slice(0,3);
 if(top.length>=2)out.push(['info','📊',`Maiores gastos do mês: ${top.map(([id,v])=>cat(id).nome+' ('+R(v)+')').join(', ')}.`]);
 if(!out.some(o=>o[0]==='bad'||o[0]==='warn')&&M.desp>0&&M.rec>0)out.unshift(['good','👏','Tudo dentro do planejado até aqui. Continue assim.']);
 return out.slice(0,5);
}

 h+=`<details class="card"><summary>Como os números são calculados</summary><p class="note">Para dívidas parceladas, o saldo é o valor presente das parcelas restantes usando a taxa mensal informada (é o que o credor cobraria para quitar hoje, sem descontos). Sem taxa, é a soma das parcelas. Para rotativo e cheque especial, o saldo é o que você informar, e a previsão considera os juros mensais sobre ele. A taxa aparece no contrato ou no extrato como “taxa de juros mensal” ou CET mensal.</p></details>`;

function obSumH(){const renda=sum(OB.renda,r=>P(r.valor));const orc=sum(Object.values(OB.orc),P);const sobra=renda-orc;

 for(const c of S.categorias)if(OB.orc[c.id]!==undefined)c.orcado=P(OB.orc[c.id]);
 S.setupDone=true;S.criado=hoje;OB=null;ensureMonth(ym);save();UI.tab='inicio';render();window.scrollTo(0,0);toast('Tudo pronto! Toque no + para o primeiro lançamento');

/* ================= folhas (sheets) ================= */
function openSheet(s){SHEET=s;drawSheet(true)}
function closeSheet(){SHEET=null;$('#sheet-root').innerHTML=''}
function drawSheet(first){if(!SHEET)return;const root=$('#sheet-root'),old=root.querySelector('.sheet'),sc=old?old.scrollTop:0;
 root.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet">${'<div class="grab"></div>'}${SHEET.render()}</div></div>`;root.querySelector('.sheet').scrollTop=sc;
 if(first&&SHEET.focus){const el=root.querySelector(SHEET.focus);if(el)setTimeout(()=>el.focus(),60)}}
const sheetHead=t=>`<div class="row between" style="margin-bottom:4px"><h2>${t}</h2><button class="iconbtn" data-act="close" aria-label="Fechar">✕</button></div>`;
function openForm(o){const d={...o.values};openSheet({draft:d,form:o,render:()=>renderForm(o,d),focus:o.focus})}
function renderForm(o,d){let h=sheetHead(esc(o.title));if(o.intro)h+=`<p class="sub">${o.intro}</p>`;
 for(const f of o.fields){if(f.show&&!f.show(d))continue;const v=d[f.k]??'';
  if(f.type==='check'){h+=`<label class="check"><input type="checkbox" data-k="${f.k}" ${v?'checked':''}><span>${f.label}</span></label>`;continue}
  if(f.type==='html'){h+=f.html(d);continue}
  let inp;
  if(f.type==='select')inp=`<select data-k="${f.k}" ${f.redraw?'data-redraw="1"':''}>${(typeof f.options==='function'?f.options(d):f.options).map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea data-k="${f.k}" rows="3" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else{const t=f.type==='date'?'date':f.type==='month'?'month':'text',im={money:'decimal',pct:'decimal',int:'numeric'}[f.type]||'';inp=`<input type="${t}" ${im?`inputmode="${im}"`:''} data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`}
  h+=`<label class="f"><span>${f.label}</span>${inp}${f.help?`<small class="sub">${f.help}</small>`:''}</label>`}

function lSave(){
 const d=SHEET.draft,tx=SHEET.tx,v=P(d.valorS);

  const n=pg.cartaoId?Math.max(1,+d.parcelas||1):1,base=r2(v/n),gid=n>1?uid():undefined,now=Date.now();let f=null;

}

function exportCSV(){const rows=[['Data','Descrição','Tipo','Categoria','Valor','Status','Conta/Cartão']];
 S.tx.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(t=>rows.push([t.data.split('-').reverse().join('/'),t.desc||'',t.tipo==='receita'?'Entrada':'Gasto',cat(t.catId).nome,String(t.valor).replace('.',','),t.status==='pago'?'Pago':'Pendente',pagLabel(t).replace('💳 ','')]));
 const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`lastro-lancamentos-${todayStr()}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000)}
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s.v||!Array.isArray(s.tx))throw 0;if(!confirm('Substituir os dados atuais por este backup?'))return;S=migrate(s);save();OB=null;render();toast('Backup restaurado ✓')}catch(_){toast('Arquivo de backup inválido')}};rd.readAsText(f);e.target.value=''});

/* ================= eventos ================= */
const ACT={
 go:el=>{UI.tab=el.dataset.tab;if(UI.tab==='mes')UI.ym=UI.ym||curYm();render();window.scrollTo(0,0)},
 lancar:()=>{if(!S.contas.length&&!S.cartoes.length)return toast('Cadastre uma conta em Ajustes');openLancar()},
 edtx:el=>{const t=S.tx.find(x=>x.id===el.dataset.id);if(t)openLancar(t)},
 mprev:()=>{UI.ym=addM(UI.ym,-1);render()},mnext:()=>{UI.ym=addM(UI.ym,1);render()},mhoje:()=>{UI.ym=curYm();render()},
 vpay:el=>{const k=el.dataset.k,id=el.dataset.id;if(k==='tx'){const t=S.tx.find(x=>x.id===id);if(t){t.status='pago';save();render();toast(t.tipo==='receita'?'Recebido ✓':'Pago ✓')}}else if(k==='fat')openPagarFatura(id,el.dataset.ym);else if(k==='div')openPagarDivida(id)},
 unfat:el=>{delete S.faturas[el.dataset.id+'|'+el.dataset.ym];save();render()},
 estr:el=>{S.prefs.estrategia=el.dataset.v;save();render()},
 nvdiv:()=>formDivida(),eddiv:el=>formDivida(S.dividas.find(x=>x.id===el.dataset.id)),paydiv:el=>openPagarDivida(el.dataset.id),
 nvmeta:()=>formMeta(),edmeta:el=>formMeta(S.metas.find(x=>x.id===el.dataset.id)),aporte:el=>formAporte(S.metas.find(x=>x.id===el.dataset.id)),
 mkreserva:()=>{const ess=sum(S.categorias.filter(c=>c.grupo==='essencial'),c=>+c.orcado||0);formMeta(null,{nome:'Reserva de emergência',emoji:'🛟',alvo:r2(ess*6),prazo:addM(curYm(),18),guardado:'',reserva:true})},
 ednome:()=>openForm({title:'Seu nome',values:{nome:S.nome},fields:[{k:'nome',label:'Nome'}],onSave:x=>{S.nome=x.nome.trim()}}),
 edcat:el=>formCat(S.categorias.find(x=>x.id===el.dataset.id)),nvcat:()=>formCat(null,'despesa'),
 edconta:el=>formConta(conta(el.dataset.id)),nvconta:()=>formConta(),
 edcartao:el=>formCartao(cartao(el.dataset.id)),nvcartao:()=>formCartao(),
 edfixa:el=>formFixa(S.fixas.find(x=>x.id===el.dataset.id)),nvfixa:()=>{if(!S.contas.length)return toast('Cadastre uma conta primeiro');formFixa()},
 export:()=>exportar(),import:()=>$('#importFile').click(),csv:()=>exportCSV(),
 reset:()=>{if(!confirm('Apagar TODOS os dados deste app? Faça um backup antes, se quiser guardar.'))return;if(!confirm('Tem certeza? Isso não pode ser desfeito.'))return;localStorage.removeItem(KEY);S=newState();OB=null;UI={tab:'inicio',ym:curYm()};render()},
 // sheets
 scrim:(el,e)=>{if(e.target===el)closeSheet()},close:()=>closeSheet(),
 fsave:()=>{const o=SHEET.form,r=o.onSave(SHEET.draft);if(r===false)return;if(typeof r==='string')return toast(r);closeSheet();save();render()},
 fdel:()=>{const r=SHEET.form.onDelete();if(r===false)return;closeSheet();save();render()},
 ltipo:el=>{const d=SHEET.draft;if(d.tipo!==el.dataset.v){d.tipo=el.dataset.v;d.catId=''}drawSheet()},
 lcat:el=>{SHEET.draft.catId=el.dataset.id;drawSheet()},lpag:el=>{SHEET.draft.pag=el.dataset.v;drawSheet()},
 lsave:()=>lSave(),
 ldel:()=>{const t=SHEET.tx;let msg='Excluir este lançamento?';if(t.grupo)msg='Excluir esta parcela? (as outras parcelas continuam)';if(!confirm(msg))return;delTx(t);closeSheet();render();toast('Excluído')},
 // onboarding
 obnext:()=>obNext(),obback:()=>{OB.step--;render();window.scrollTo(0,0)},
 obadd:el=>{const l=el.dataset.list,def=obPayOpts()[0]?.[0]||'';OB[l].push(l==='contas'?{nome:'',saldo:''}:l==='cartoes'?{nome:'',fechamento:'',vencimento:'',limite:''}:l==='renda'?{desc:'',valor:'',dia:'',pag:'c:0'}:{desc:'',catId:catsDe('despesa')[0]?.id,valor:'',dia:'',pag:def});render()},
 obdel:el=>{OB[el.dataset.list].splice(+el.dataset.i,1);render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.dataset.act!=='scrim')e.preventDefault();f(el,e)}});
function onField(e){const el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;const isSel=el.tagName==='SELECT'||el.type==='checkbox';if(e.type==='input'&&isSel)return;if(e.type==='change'&&!isSel)return;
 const dr=SHEET?SHEET.draft:OB;if(!dr)return;setPath(dr,k,el.type==='checkbox'?el.checked:el.value);
 if(SHEET){if(el.dataset.redraw||(SHEET.tx!==undefined&&(k==='valorS'&&false)))drawSheet();if(SHEET&&SHEET.tx!==undefined&&k==='valorS'){const s=document.querySelector('#sheet-root select[data-k="parcelas"]');if(s){const v=P(el.value);[...s.options].forEach((o,i)=>{if(i>0)o.textContent=(i+1)+'x'+(v?' de '+R(v/(i+1)):'')})}}}
 else if(OB&&OB.step===5){const b=$('#obsum');if(b)b.innerHTML=obSumH()}}
document.addEventListener('input',onField);document.addEventListener('change',onField);

function render(){
 const app=$('#app');
 if(!S.setupDone){if(!OB)OB=obInit();app.innerHTML=renderOB();return}
 const scr={inicio:scrInicio,mes:scrMes,dividas:scrDividas,metas:scrMetas,ajustes:scrAjustes}[UI.tab]||scrInicio;
 app.innerHTML=`<div class="wrap">${scr()}</div>${tabbar()}`;
}
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!SHEET)render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
